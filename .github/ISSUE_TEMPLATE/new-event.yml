name: 投稿新活动
description: 分享一场面向悉大学生的活动，维护者核实后收录。
title: "[活动投稿] "
labels: ["投稿"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你一起维护悉大活动墙。Issue 会公开展示，请不要提交私人联系方式。
        维护者审核通过后自动收录。
  - type: input
    id: event-title
    attributes:
      label: 活动名称
      placeholder: 例如，周五草坪音乐会
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: 活动标签
      description: 至少选择一个，可多选。社团主办请加上社团标签；免费指免费入场。
      multiple: true
      options:
        - 社团
        - 社交
        - 学习
        - 职业
        - 运动
        - 公益
        - 美食
        - 音乐
        - 免费
        - 线上
    validations:
      required: true
  - type: input
    id: organiser
    attributes:
      label: 主办方 / 社团名称
      description: 社团活动请填写社团全名，方便同学搜索。
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: 活动日期
      description: 格式 YYYY-MM-DD；多日活动填写 YYYY-MM-DD 至 YYYY-MM-DD。
      placeholder: "2026-10-06"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 悉尼当地时间
      description: 如果尚未公布，请写时间待公布。
      placeholder: "11:00 开始，送完为止"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 地点
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: 费用与参加条件
      description: 区分免费入场与消费项目；说明是否要求会员资格。
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 活动介绍
    validations:
      required: true
  - type: input
    id: registration
    attributes:
      label: 报名链接
      placeholder: "https://…"
  - type: textarea
    id: source
    attributes:
      label: 可核对的来源
      description: 填写来源链接，或在此处 /「配图」中上传邮件、通知截图，至少提供一种。无链接时请将通知截图放在第一张，并先遮去私人信息。
    validations:
      required: false
  - type: input
    id: expires-on
    attributes:
      label: 展示截止日期
      description: 可选，格式 YYYY-MM-DD。当天结束后退出首页推荐，长期内容可留空。
  - type: textarea
    id: images
    attributes:
      label: 配图
      description: 直接粘贴或拖入图片，最多 3 张、每张不超过 5 MB；第一张作为封面。请使用 PNG、JPG、GIF 或 WebP。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认信息
      options:
        - label: 以上信息及配图可以公开展示，已附可核对的来源。
          required: true
