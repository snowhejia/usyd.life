name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Build Docker image
        run: docker build -t usyd-life:test .
      - name: Check container with persistent volume
        run: |
          docker volume create usyd-data
          docker run -d --name usyd-life -p 3000:3000 -v usyd-data:/data usyd-life:test
          for attempt in 1 2 3 4 5; do
            if curl --fail http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs usyd-life
          exit 1
