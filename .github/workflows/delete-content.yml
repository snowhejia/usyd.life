name: Delete collected content
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '删除请求 Issue 编号（需有删除内容标签）'
        required: true
        type: string
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: delete-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  delete:
    if: github.event_name == 'workflow_dispatch' || (!github.event.issue.pull_request && contains(github.event.issue.labels.*.name, '删除内容') && (github.event.action == 'opened' || github.event.label.name == '删除内容'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify maintainer request and remove content
        run: node scripts/delete-content.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
